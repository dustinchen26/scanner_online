<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI 掃描器 (by Dustin)</title>
    <!-- 引入 EXIF 庫以解決旋轉問題 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        html, body { height: 100%; height: 100dvh; overflow: hidden; background-color: #121212; color: #e0e0e0; }
        body { display: flex; flex-direction: column; height: 100%; height: 100dvh; overflow: hidden; position: relative; }

        #line-warning {
            display: none;
            background: #ff6b35;
            color: #fff;
            text-align: center;
            padding: 8px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            flex-shrink: 0;
            width: 100%;
            z-index: 999;
            box-shadow: 0 2px 8px rgba(255,107,53,0.4);
            animation: warnPulse 1.5s ease-in-out infinite alternate;
            position: relative;
        }
        #line-warning .switch-mode {
            display: inline-block;
            margin-left: 12px;
            background: rgba(255,255,255,0.2);
            padding: 2px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.75rem;
            border: 1px solid rgba(255,255,255,0.3);
        }
        @keyframes warnPulse { 0% { opacity: 0.9; } 100% { opacity: 1; } }

        header {
            background-color: #1e1e1e;
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2d2d2d;
            flex-shrink: 0;
            min-height: 44px;
        }
        .logo { font-size: 0.95rem; font-weight: 700; color: #00d26a; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .logo small { font-size: 0.7rem; font-weight: 400; color: #888; margin-left: 4px; }
        .status-badge { font-size: 0.7rem; padding: 3px 10px; border-radius: 20px; background-color: #333; color: #aaa; white-space: nowrap; flex-shrink: 0; }
        .status-badge.ready { background-color: #1b3bbb; color: #8bb2ff; }
        .status-badge.android-line { background-color: #6b2a1a; color: #ff9966; }

        main {
            flex: 1 1 auto;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0a0a0a;
            padding: 4px;
            min-height: 0;
            overflow: hidden;
        }
        #canvas-container {
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            border-radius: 6px;
            overflow: hidden;
            background: #181818;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #main-canvas {
            display: block;
            touch-action: none;
            cursor: crosshair;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }
        .placeholder-text {
            position: absolute;
            color: #666;
            font-size: 1rem;
            text-align: center;
            pointer-events: none;
            padding: 0 16px;
            user-select: none;
        }

        footer {
            background-color: #1e1e1e;
            padding: 6px 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 6px;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #2d2d2d;
            flex-shrink: 0;
            min-height: 48px;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .btn {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #3d3d3d;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
            touch-action: manipulation;
            min-height: 32px;
        }
        .btn:active:not(:disabled) { transform: scale(0.95); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn-primary {
            background-color: #107c41;
            border-color: #107c41;
            color: white;
            font-weight: 600;
        }
        .btn-primary:active:not(:disabled) { background-color: #0b5e31; }
        .btn-primary:disabled { background-color: #1a4a2e; border-color: #1a4a2e; }

        .checkbox-label, .select-label {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 0.72rem;
            cursor: pointer;
            color: #ccc;
            white-space: nowrap;
        }
        .checkbox-label input[type="checkbox"] { width: 14px; height: 14px; accent-color: #00d26a; cursor: pointer; flex-shrink: 0; }
        .custom-select {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #3d3d3d;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.72rem;
            outline: none;
            cursor: pointer;
            min-height: 28px;
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border-left-color: #00d26a;
            animation: spin 1s linear infinite;
            display: inline-block;
            flex-shrink: 0;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #output-canvas { display: none; }

        #image-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 99999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            box-sizing: border-box;
            overflow: auto;
        }
        #image-overlay img {
            max-width: 100%;
            max-height: 65vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            background: #000;
            touch-action: none;
        }
        #image-overlay .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
            justify-content: center;
            width: 100%;
            max-width: 400px;
        }
        #image-overlay .controls button {
            flex: 1;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 30px;
            border: none;
            background: #107c41;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            min-width: 120px;
            touch-action: manipulation;
        }
        #image-overlay .controls button.close {
            background: #555;
        }
        #image-overlay .controls button:active { transform: scale(0.95); }
        #image-overlay p {
            color: #ddd;
            font-size: 0.95rem;
            margin: 12px 0 0;
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 20px;
        }
        #image-overlay .hint {
            color: #aaa;
            font-size: 0.8rem;
            margin-top: 8px;
        }

        @media (max-width: 480px) {
            header { padding: 4px 8px; min-height: 38px; }
            .logo { font-size: 0.78rem; }
            .logo small { font-size: 0.6rem; }
            .btn { font-size: 0.65rem; padding: 3px 7px; min-height: 28px; }
            .checkbox-label, .select-label { font-size: 0.65rem; }
            .custom-select { font-size: 0.65rem; padding: 2px 5px; min-height: 24px; }
            footer { padding: 4px 6px; gap: 3px; min-height: 40px; }
            .control-group { gap: 3px; }
            .status-badge { font-size: 0.6rem; padding: 2px 8px; }
            #line-warning { font-size: 0.75rem; padding: 6px 10px; }
            #image-overlay img { max-height: 55vh; }
            #image-overlay .controls button { font-size: 0.9rem; padding: 10px 14px; }
        }
        @media (min-width: 769px) {
            .btn { padding: 7px 16px; font-size: 0.9rem; min-height: 38px; }
            .checkbox-label, .select-label { font-size: 0.85rem; }
            .custom-select { font-size: 0.85rem; padding: 5px 10px; min-height: 34px; }
            footer { padding: 8px 16px; min-height: 56px; }
        }
        @media (max-width: 360px) {
            footer { flex-direction: column; align-items: stretch; gap: 4px; }
            .control-group { justify-content: center; }
        }
    </style>
</head>
<body>
    <div id="line-warning">
        <span id="warning-text">⚠️ 偵測到 Android LINE 瀏覽器，無法直接下載。系統將在「本頁面」顯示圖片，請使用「分享」或「截圖」儲存。</span>
        <span class="switch-mode" onclick="toggleForceMode()">🔄 切換模式</span>
        <span style="display:inline-block;margin-left:6px;font-size:1.2rem;">📱</span>
    </div>

    <header>
        <div class="logo">📷 AI 掃描器 <small>by Dustin</small></div>
        <div id="status-badge" class="status-badge">載入中…</div>
    </header>

    <main>
        <div id="canvas-container">
            <canvas id="main-canvas"></canvas>
            <div id="placeholder" class="placeholder-text">點下方 「📂 開啟照片」</div>
        </div>
    </main>

    <footer>
        <div class="control-group">
            <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="handleFileSelect(event)">
            <button class="btn" onclick="document.getElementById('file-input').click()">📂 開啟</button>
            <button class="btn" id="btn-auto" onclick="autoDetect()" disabled>🔍 自動</button>
            <button class="btn" id="btn-reset" onclick="resetToFull()" disabled>🔄 全畫面</button>
        </div>
        <div class="control-group">
            <label class="checkbox-label">
                <input type="checkbox" id="filter-check" onchange="redraw()"> 優化
            </label>
            <label class="select-label">
                <select id="export-format" class="custom-select">
                    <option value="png">PNG</option>
                    <option value="jpg_max">JPG 100%</option>
                    <option value="jpg_standard" selected>JPG 92%</option>
                </select>
            </label>
            <button class="btn btn-primary" id="btn-save" onclick="processAndSave()" disabled>✅ 儲存</button>
        </div>
    </footer>

    <canvas id="output-canvas"></canvas>

    <div id="image-overlay">
        <img id="overlay-img" src="" alt="掃描結果" />
        <div class="controls">
            <button id="share-btn" onclick="shareOverlayImage()">📤 分享圖片</button>
            <button class="close" onclick="closeOverlay()">✕ 關閉</button>
        </div>
        <p>📸 點「分享」可儲存至相簿；若無效，請 <b>截圖</b> 儲存</p>
        <p class="hint">💡 建議使用 Chrome / Samsung 瀏覽器以獲得完整下載功能</p>
    </div>

    <script>
        // ============================================================
        //  核心變數
        // ============================================================
        let cvReady = false;
        let origImage = null;
        let imgMat = null;
        let displayWidth = 0;
        let displayHeight = 0;
        let scaleRatio = 1.0;
        let points = [];
        let selectedIdx = -1;
        let isDragging = false;
        let isResizing = false;
        let resizeTimeout = null;

        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');
        const placeholder = document.getElementById('placeholder');
        const statusBadge = document.getElementById('status-badge');
        const lineWarning = document.getElementById('line-warning');
        const warningText = document.getElementById('warning-text');

        const MAX_IMAGE_SIZE = 2000;
        let lastProcessedDataURL = null;
        let forceAndroidLineMode = false;

        // ============================================================
        //  裝置偵測（僅 Android LINE 顯示警告）
        // ============================================================
        function detectBrowser() {
            const ua = navigator.userAgent;
            const isIOS = /iPad|iPhone|iPod/.test(ua) || (/Mac OS X/.test(ua) && /Mobile/.test(ua));
            const isAndroid = /Android/.test(ua) && !/Windows/.test(ua);
            const isIPadDesktop = isIOS && !/iPhone|iPod/.test(ua) && navigator.maxTouchPoints > 1;
            const isIPhone = (/iPhone/.test(ua) || (/Mac OS X/.test(ua) && /Mobile/.test(ua))) && !isIPadDesktop;
            const isLine = /Line/i.test(ua) || /LINE/i.test(ua);
            const isAndroidLine = isAndroid && isLine;

            if (isAndroidLine) {
                lineWarning.style.display = 'block';
                warningText.textContent = '⚠️ 偵測到 Android LINE 瀏覽器，無法直接下載。系統將在「本頁面」顯示圖片，請使用「分享」或「截圖」儲存。';
                statusBadge.textContent = '⚠️ Android LINE';
                statusBadge.className = 'status-badge android-line';
            } else {
                lineWarning.style.display = 'none';
                if (cvReady) {
                    statusBadge.textContent = '系統就緒';
                    statusBadge.className = 'status-badge ready';
                } else {
                    statusBadge.textContent = '載入中…';
                    statusBadge.className = 'status-badge';
                }
            }
            return { isAndroidLine, isIPhone, isLine };
        }

        function toggleForceMode() {
            forceAndroidLineMode = !forceAndroidLineMode;
            const msg = forceAndroidLineMode ? '已切換至「Android LINE 遮罩模式」' : '已切換回「自動偵測模式」';
            alert(msg);
            const info = detectBrowser();
            if (forceAndroidLineMode) {
                lineWarning.style.display = 'block';
                warningText.textContent = '⚠️ 手動強制為「Android LINE 遮罩模式」。';
                statusBadge.textContent = '🔧 遮罩強制';
                statusBadge.className = 'status-badge android-line';
            } else {
                if (!info.isAndroidLine) {
                    lineWarning.style.display = 'none';
                    if (cvReady) {
                        statusBadge.textContent = '系統就緒';
                        statusBadge.className = 'status-badge ready';
                    }
                }
            }
        }

        let browserInfo = detectBrowser();

        function useAndroidLineMode() {
            return forceAndroidLineMode || browserInfo.isAndroidLine;
        }

        // ============================================================
        //  OpenCV 初始化
        // ============================================================
        function onOpenCvReady() {
            cv.onRuntimeInitialized = () => {
                cvReady = true;
                browserInfo = detectBrowser();
                if (!browserInfo.isAndroidLine && !forceAndroidLineMode) {
                    statusBadge.textContent = '系統就緒';
                    statusBadge.className = 'status-badge ready';
                }
            };
        }

        // ============================================================
        //  EXIF 旋轉輔助函數
        // ============================================================
        function getOrientation(file, callback) {
            EXIF.getData(file, function() {
                let orientation = EXIF.getTag(this, 'Orientation') || 1;
                callback(orientation);
            });
        }

        // 將圖片依照 Orientation 旋轉並繪製到 canvas，回傳 dataURL
        function rotateImageByOrientation(img, orientation) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            let w = img.width, h = img.height;
            let rot = 0, scaleX = 1, scaleY = 1;
            switch (orientation) {
                case 2: scaleX = -1; break;
                case 3: rot = 180; break;
                case 4: scaleY = -1; break;
                case 5: rot = 90; scaleX = -1; break;
                case 6: rot = 90; break;
                case 7: rot = -90; scaleX = -1; break;
                case 8: rot = -90; break;
                default: break;
            }
            if (rot === 90 || rot === -90) {
                [w, h] = [h, w];
            }
            canvas.width = w;
            canvas.height = h;
            ctx.translate(w/2, h/2);
            ctx.rotate(rot * Math.PI/180);
            if (scaleX === -1) ctx.scale(-1, 1);
            if (scaleY === -1) ctx.scale(1, -1);
            ctx.drawImage(img, -img.width/2, -img.height/2);
            return canvas.toDataURL('image/png');
        }

        // ============================================================
        //  檔案載入（修正 EXIF 旋轉 + 縮圖）
        // ============================================================
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    // 讀取 EXIF 旋轉資訊
                    getOrientation(file, function(orientation) {
                        let finalSrc = img;
                        let finalW = img.width, finalH = img.height;
                        // 若需旋轉，產生旋轉後的圖片
                        if (orientation && orientation !== 1) {
                            const dataUrl = rotateImageByOrientation(img, orientation);
                            const rotatedImg = new Image();
                            rotatedImg.onload = function() {
                                // 旋轉後再縮圖
                                processScaledImage(rotatedImg);
                            };
                            rotatedImg.src = dataUrl;
                        } else {
                            // 不需旋轉直接處理
                            processScaledImage(img);
                        }
                    });
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        function processScaledImage(img) {
            let w = img.width, h = img.height;
            let scale = 1;
            if (w > MAX_IMAGE_SIZE || h > MAX_IMAGE_SIZE) {
                scale = Math.min(MAX_IMAGE_SIZE / w, MAX_IMAGE_SIZE / h);
            }
            const newW = Math.round(w * scale);
            const newH = Math.round(h * scale);

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = newW;
            tempCanvas.height = newH;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(img, 0, 0, newW, newH);

            const scaledImg = new Image();
            scaledImg.onload = function() {
                origImage = scaledImg;
                if (imgMat) imgMat.delete();
                if (cvReady) {
                    const tempCanvas2 = document.createElement('canvas');
                    tempCanvas2.width = newW;
                    tempCanvas2.height = newH;
                    const ctx2 = tempCanvas2.getContext('2d');
                    ctx2.drawImage(scaledImg, 0, 0);
                    imgMat = cv.imread(tempCanvas2);
                }
                // 強制重新計算顯示尺寸（先重置點，避免舊座標干擾）
                points = [];
                fitCanvasToWindow(true);
                placeholder.style.display = 'none';
                document.getElementById('btn-auto').disabled = false;
                document.getElementById('btn-reset').disabled = false;
                document.getElementById('btn-save').disabled = false;
                resetToFull();
                autoDetect();
            };
            scaledImg.src = tempCanvas.toDataURL('image/png');
        }

        // ============================================================
        //  自適應畫布（穩定版，防止無限循環）
        // ============================================================
        function fitCanvasToWindow(force = false) {
            if (!origImage) return;
            if (isResizing && !force) return;
            isResizing = true;

            try {
                const container = document.getElementById('canvas-container');
                const rect = container.getBoundingClientRect();
                let maxW = rect.width - 4;
                let maxH = rect.height - 4;

                if (maxW < 10 || maxH < 10 || !isFinite(maxW) || !isFinite(maxH)) {
                    maxW = Math.max(200, window.innerWidth * 0.8);
                    maxH = Math.max(200, window.innerHeight * 0.6);
                }

                let w = origImage.width, h = origImage.height;
                const scale = Math.min(maxW / w, maxH / h);
                const newW = Math.round(w * scale);
                const newH = Math.round(h * scale);

                if (displayWidth !== newW || displayHeight !== newH) {
                    displayWidth = newW;
                    displayHeight = newH;
                    canvas.width = displayWidth;
                    canvas.height = displayHeight;
                    canvas.style.width = displayWidth + 'px';
                    canvas.style.height = displayHeight + 'px';
                    scaleRatio = origImage.width / displayWidth;

                    // 若有舊點，按比例調整，避免超出邊界
                    if (points.length === 4) {
                        const oldW = canvas.width || displayWidth;
                        const oldH = canvas.height || displayHeight;
                        if (oldW > 0 && oldH > 0) {
                            const sx = displayWidth / oldW;
                            const sy = displayHeight / oldH;
                            points = points.map(p => ({
                                x: Math.min(displayWidth - 2, Math.max(2, p.x * sx)),
                                y: Math.min(displayHeight - 2, Math.max(2, p.y * sy))
                            }));
                        } else {
                            resetToFull();
                        }
                    }
                    redraw();
                }
            } finally {
                isResizing = false;
            }
        }

        // 監聽容器尺寸變化（防抖）
        const ro = new ResizeObserver(() => {
            if (origImage) {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    if (!isResizing) {
                        fitCanvasToWindow(true);
                    }
                }, 100);
            }
        });
        ro.observe(document.getElementById('canvas-container'));

        window.addEventListener('resize', () => {
            if (origImage) {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    if (!isResizing) {
                        fitCanvasToWindow(true);
                    }
                }, 100);
            }
        });

        // ============================================================
        //  拖曳控制
        // ============================================================
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
            const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function handleStart(e) {
            if (!points.length) return;
            e.preventDefault();
            const pos = getCanvasCoords(e);
            const threshold = 30;
            for (let i = 0; i < points.length; i++) {
                const dx = pos.x - points[i].x;
                const dy = pos.y - points[i].y;
                if (dx*dx + dy*dy < threshold*threshold) {
                    selectedIdx = i;
                    isDragging = true;
                    break;
                }
            }
        }

        function handleMove(e) {
            if (!isDragging || selectedIdx < 0) return;
            e.preventDefault();
            const pos = getCanvasCoords(e);
            const x = Math.max(2, Math.min(displayWidth - 2, pos.x));
            const y = Math.max(2, Math.min(displayHeight - 2, pos.y));
            points[selectedIdx] = { x, y };
            redraw();
        }

        function handleEnd(e) {
            if (isDragging) {
                isDragging = false;
                selectedIdx = -1;
            }
        }

        canvas.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', (e) => { if (isDragging) handleMove(e); });
        window.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('touchstart', handleStart, { passive: false });
        window.addEventListener('touchmove', (e) => { if (isDragging) handleMove(e); }, { passive: false });
        window.addEventListener('touchend', handleEnd);

        function sortPoints(pts) {
            let sums = pts.map(p => p.x + p.y);
            let diffs = pts.map(p => p.y - p.x);
            let topLeft = pts[sums.indexOf(Math.min(...sums))];
            let bottomRight = pts[sums.indexOf(Math.max(...sums))];
            let topRight = pts[diffs.indexOf(Math.min(...diffs))];
            let bottomLeft = pts[diffs.indexOf(Math.max(...diffs))];
            return [topLeft, topRight, bottomRight, bottomLeft];
        }

        // ============================================================
        //  自動偵測
        // ============================================================
        function autoDetect() {
            if (!cvReady || !imgMat) { resetToFull(); return; }
            try {
                let gray = new cv.Mat();
                cv.cvtColor(imgMat, gray, cv.COLOR_RGBA2GRAY);
                let blurred = new cv.Mat();
                cv.GaussianBlur(gray, blurred, new cv.Size(5,5), 0);
                let thresh = new cv.Mat();
                cv.threshold(blurred, thresh, 0, 255, cv.THRESH_BINARY + cv.THRESH_OTSU);
                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(thresh, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let totalArea = imgMat.rows * imgMat.cols;
                let maxArea = 0;
                let bestApprox = null;

                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    let area = cv.contourArea(cnt);
                    if (area < totalArea * 0.01 || area > totalArea * 0.95) {
                        cnt.delete();
                        continue;
                    }
                    let peri = cv.arcLength(cnt, true);
                    let approx = new cv.Mat();
                    cv.approxPolyDP(cnt, approx, 0.02 * peri, true);
                    if (approx.rows === 4 && area > maxArea) {
                        maxArea = area;
                        if (bestApprox) bestApprox.delete();
                        bestApprox = approx;
                    } else {
                        approx.delete();
                    }
                    cnt.delete();
                }

                if (bestApprox && maxArea > totalArea * 0.05) {
                    let detected = [];
                    for (let i = 0; i < 4; i++) {
                        detected.push({
                            x: bestApprox.data32S[i*2] / scaleRatio,
                            y: bestApprox.data32S[i*2+1] / scaleRatio
                        });
                    }
                    points = sortPoints(detected);
                    bestApprox.delete();
                } else {
                    if (bestApprox) bestApprox.delete();
                    resetToFull();
                }
                gray.delete(); blurred.delete(); thresh.delete();
                contours.delete(); hierarchy.delete();
            } catch (err) {
                console.warn("Auto detect error, keeping full view", err);
                resetToFull();
            }
            redraw();
        }

        function resetToFull() {
            const margin = 20;
            if (displayWidth < 40 || displayHeight < 40) {
                points = [
                    { x: 0, y: 0 },
                    { x: displayWidth || 100, y: 0 },
                    { x: displayWidth || 100, y: displayHeight || 100 },
                    { x: 0, y: displayHeight || 100 }
                ];
            } else {
                points = [
                    { x: margin, y: margin },
                    { x: displayWidth - margin, y: margin },
                    { x: displayWidth - margin, y: displayHeight - margin },
                    { x: margin, y: displayHeight - margin }
                ];
            }
            redraw();
        }

        function redraw() {
            if (!origImage) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(origImage, 0, 0, displayWidth, displayHeight);
            if (points.length === 4) {
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                ctx.lineTo(points[1].x, points[1].y);
                ctx.lineTo(points[2].x, points[2].y);
                ctx.lineTo(points[3].x, points[3].y);
                ctx.closePath();
                ctx.fillStyle = 'rgba(0, 255, 100, 0.2)';
                ctx.fill();
                ctx.strokeStyle = '#00ff66';
                ctx.lineWidth = 2;
                ctx.stroke();
                points.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 10, 0, 2*Math.PI);
                    ctx.fillStyle = '#0078d4';
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                });
            }
        }

        // ---- 彩色濾鏡 (返回 RGBA) ----
        function applyColorPerfectFilter(srcMat) {
            let rgbMat = new cv.Mat();
            cv.cvtColor(srcMat, rgbMat, cv.COLOR_RGBA2RGB);
            let smooth = new cv.Mat();
            cv.bilateralFilter(rgbMat, smooth, 9, 75, 75);
            let hsv = new cv.Mat();
            cv.cvtColor(smooth, hsv, cv.COLOR_RGB2HSV);
            let channels = new cv.MatVector();
            cv.split(hsv, channels);
            let s = channels.get(1);
            let v = channels.get(2);
            s.convertTo(s, -1, 1.25, 0);
            v.convertTo(v, -1, 1.1, 0);
            cv.merge(channels, hsv);
            let enhanced = new cv.Mat();
            cv.cvtColor(hsv, enhanced, cv.COLOR_HSV2RGB);
            let finalResult = new cv.Mat();
            enhanced.convertTo(finalResult, -1, 1.1, -10);
            let rgba = new cv.Mat();
            cv.cvtColor(finalResult, rgba, cv.COLOR_RGB2RGBA);
            rgbMat.delete(); smooth.delete(); hsv.delete();
            channels.delete(); s.delete(); v.delete(); enhanced.delete(); finalResult.delete();
            return rgba;
        }

        // ---- 判斷行動裝置 (一般用途) ----
        function isMobileDevice() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            if (/iPhone|iPad|iPod|Android|BlackBerry|Windows Phone|Opera Mini|IEMobile/i.test(ua)) return true;
            if (window.innerWidth < 768 && ('ontouchstart' in window || navigator.maxTouchPoints > 0)) return true;
            return false;
        }

        // ============================================================
        //  ★★★ 全螢幕遮罩顯示 ★★★
        // ============================================================
        function showImageOverlay(dataUrl) {
            lastProcessedDataURL = dataUrl;
            const overlay = document.getElementById('image-overlay');
            const img = document.getElementById('overlay-img');
            img.src = dataUrl;
            overlay.style.display = 'flex';
        }

        function closeOverlay() {
            document.getElementById('image-overlay').style.display = 'none';
        }

        function shareOverlayImage() {
            if (!lastProcessedDataURL) {
                alert('請先產生圖片');
                return;
            }
            fetch(lastProcessedDataURL)
                .then(res => res.blob())
                .then(blob => {
                    const file = new File([blob], 'scanned_image.png', { type: 'image/png' });
                    if (navigator.share && navigator.canShare) {
                        navigator.share({
                            files: [file],
                            title: '掃描結果'
                        }).catch(err => {
                            if (err.name !== 'AbortError') {
                                alert('分享失敗，請使用截圖儲存。');
                            }
                        });
                    } else {
                        alert('您的瀏覽器不支援分享功能，請使用截圖儲存。');
                    }
                })
                .catch(() => {
                    alert('無法處理圖片，請使用截圖儲存。');
                });
        }

        // ============================================================
        //  ★★★ 儲存邏輯 ★★★
        // ============================================================
        function processAndSave() {
            if (!origImage || points.length !== 4) {
                alert('請先載入圖片並框選區域');
                return;
            }

            if (useAndroidLineMode()) {
                const saveBtn = document.getElementById('btn-save');
                saveBtn.disabled = true;
                saveBtn.innerHTML = '<span class="spinner"></span> 準備中…';

                setTimeout(() => {
                    try {
                        const sortedPts = sortPoints(points);
                        const origPts = sortedPts.map(p => ({
                            x: p.x * scaleRatio,
                            y: p.y * scaleRatio
                        }));

                        let w1 = Math.hypot(origPts[1].x - origPts[0].x, origPts[1].y - origPts[0].y);
                        let w2 = Math.hypot(origPts[2].x - origPts[3].x, origPts[2].y - origPts[3].y);
                        let maxW = Math.max(Math.round(w1), Math.round(w2));
                        let h1 = Math.hypot(origPts[1].x - origPts[2].x, origPts[1].y - origPts[2].y);
                        let h2 = Math.hypot(origPts[0].x - origPts[3].x, origPts[0].y - origPts[3].y);
                        let maxH = Math.max(Math.round(h1), Math.round(h2));

                        const MAX_OUTPUT = 2000;
                        if (maxW > MAX_OUTPUT || maxH > MAX_OUTPUT) {
                            const scaleOut = Math.min(MAX_OUTPUT / maxW, MAX_OUTPUT / maxH);
                            maxW = Math.round(maxW * scaleOut);
                            maxH = Math.round(maxH * scaleOut);
                        }
                        if (maxW < 10) maxW = 100;
                        if (maxH < 10) maxH = 100;

                        let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                            origPts[0].x, origPts[0].y,
                            origPts[1].x, origPts[1].y,
                            origPts[2].x, origPts[2].y,
                            origPts[3].x, origPts[3].y
                        ]);
                        let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                            0, 0,
                            maxW - 1, 0,
                            maxW - 1, maxH - 1,
                            0, maxH - 1
                        ]);
                        let M = cv.getPerspectiveTransform(srcTri, dstTri);
                        let warped = new cv.Mat();
                        let dsize = new cv.Size(maxW, maxH);
                        cv.warpPerspective(imgMat, warped, M, dsize, cv.INTER_LANCZOS4, cv.BORDER_CONSTANT, new cv.Scalar());

                        const applyFilter = document.getElementById('filter-check').checked;
                        let finalMat;
                        if (applyFilter) {
                            finalMat = applyColorPerfectFilter(warped);
                            warped.delete();
                        } else {
                            finalMat = warped;
                        }

                        const outCanvas = document.getElementById('output-canvas');
                        outCanvas.width = maxW;
                        outCanvas.height = maxH;
                        cv.imshow(outCanvas, finalMat);

                        srcTri.delete(); dstTri.delete(); M.delete();

                        const dataUrl = outCanvas.toDataURL('image/png');
                        finalMat.delete();

                        showImageOverlay(dataUrl);

                        saveBtn.disabled = false;
                        saveBtn.innerHTML = '✅ 儲存';

                    } catch (err) {
                        console.error(err);
                        alert('處理失敗，請重試。若持續失敗，請關閉「優化」功能。');
                        saveBtn.disabled = false;
                        saveBtn.innerHTML = '✅ 儲存';
                    }
                }, 80);
                return;
            }

            // ---- 一般模式 ----
            const saveBtn = document.getElementById('btn-save');
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<span class="spinner"></span> 處理中…';

            setTimeout(() => {
                try {
                    const sortedPts = sortPoints(points);
                    const origPts = sortedPts.map(p => ({
                        x: p.x * scaleRatio,
                        y: p.y * scaleRatio
                    }));

                    let w1 = Math.hypot(origPts[1].x - origPts[0].x, origPts[1].y - origPts[0].y);
                    let w2 = Math.hypot(origPts[2].x - origPts[3].x, origPts[2].y - origPts[3].y);
                    let maxW = Math.max(Math.round(w1), Math.round(w2));
                    let h1 = Math.hypot(origPts[1].x - origPts[2].x, origPts[1].y - origPts[2].y);
                    let h2 = Math.hypot(origPts[0].x - origPts[3].x, origPts[0].y - origPts[3].y);
                    let maxH = Math.max(Math.round(h1), Math.round(h2));

                    const MAX_OUTPUT = 2000;
                    if (maxW > MAX_OUTPUT || maxH > MAX_OUTPUT) {
                        const scaleOut = Math.min(MAX_OUTPUT / maxW, MAX_OUTPUT / maxH);
                        maxW = Math.round(maxW * scaleOut);
                        maxH = Math.round(maxH * scaleOut);
                    }
                    if (maxW < 10) maxW = 100;
                    if (maxH < 10) maxH = 100;

                    let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                        origPts[0].x, origPts[0].y,
                        origPts[1].x, origPts[1].y,
                        origPts[2].x, origPts[2].y,
                        origPts[3].x, origPts[3].y
                    ]);
                    let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                        0, 0,
                        maxW - 1, 0,
                        maxW - 1, maxH - 1,
                        0, maxH - 1
                    ]);
                    let M = cv.getPerspectiveTransform(srcTri, dstTri);
                    let warped = new cv.Mat();
                    let dsize = new cv.Size(maxW, maxH);
                    cv.warpPerspective(imgMat, warped, M, dsize, cv.INTER_LANCZOS4, cv.BORDER_CONSTANT, new cv.Scalar());

                    const applyFilter = document.getElementById('filter-check').checked;
                    let finalMat;
                    if (applyFilter) {
                        finalMat = applyColorPerfectFilter(warped);
                        warped.delete();
                    } else {
                        finalMat = warped;
                    }

                    const outCanvas = document.getElementById('output-canvas');
                    outCanvas.width = maxW;
                    outCanvas.height = maxH;
                    cv.imshow(outCanvas, finalMat);

                    srcTri.delete(); dstTri.delete(); M.delete();

                    const formatChoice = document.getElementById('export-format').value;
                    let mimeType, fileName, quality;
                    if (formatChoice === 'png') {
                        mimeType = 'image/png';
                        fileName = 'scanner_output.png';
                        quality = undefined;
                    } else if (formatChoice === 'jpg_max') {
                        mimeType = 'image/jpeg';
                        fileName = 'scanner_output.jpg';
                        quality = 1.0;
                    } else {
                        mimeType = 'image/jpeg';
                        fileName = 'scanner_output.jpg';
                        quality = 0.92;
                    }

                    outCanvas.toBlob(function(blob) {
                        if (!blob) {
                            const dataUrl = outCanvas.toDataURL('image/png');
                            showImageOverlay(dataUrl);
                            finalMat.delete();
                            saveBtn.disabled = false;
                            saveBtn.innerHTML = '✅ 儲存';
                            return;
                        }

                        const mobile = isMobileDevice();

                        if (mobile && navigator.share && navigator.canShare) {
                            const file = new File([blob], fileName, { type: mimeType });
                            const shareData = { files: [file], title: '掃描結果' };
                            if (navigator.canShare(shareData)) {
                                navigator.share(shareData)
                                    .then(() => {
                                        saveBtn.disabled = false;
                                        saveBtn.innerHTML = '✅ 儲存';
                                        finalMat.delete();
                                    })
                                    .catch((err) => {
                                        if (err.name !== 'AbortError') {
                                            const dataUrl = outCanvas.toDataURL('image/png');
                                            showImageOverlay(dataUrl);
                                        }
                                        saveBtn.disabled = false;
                                        saveBtn.innerHTML = '✅ 儲存';
                                        finalMat.delete();
                                    });
                                return;
                            }
                        }

                        try {
                            const link = document.createElement('a');
                            link.download = fileName;
                            link.href = URL.createObjectURL(blob);
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                            setTimeout(() => URL.revokeObjectURL(link.href), 8000);
                            saveBtn.disabled = false;
                            saveBtn.innerHTML = '✅ 儲存';
                            finalMat.delete();
                            return;
                        } catch (e) {
                            console.warn('Download failed', e);
                        }

                        const dataUrl = outCanvas.toDataURL('image/png');
                        showImageOverlay(dataUrl);
                        saveBtn.disabled = false;
                        saveBtn.innerHTML = '✅ 儲存';
                        finalMat.delete();

                    }, mimeType, quality);

                } catch (err) {
                    console.error(err);
                    alert('處理失敗，請重試。');
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = '✅ 儲存';
                }
            }, 80);
        }

        // ---- 初始化 ----
        resetToFull();

        document.addEventListener('DOMContentLoaded', function() {
            browserInfo = detectBrowser();
            if (browserInfo.isAndroidLine || forceAndroidLineMode) {
                lineWarning.style.display = 'block';
            } else {
                lineWarning.style.display = 'none';
            }
        });

        window.onOpenCvReady = onOpenCvReady;
        window.handleFileSelect = handleFileSelect;
        window.autoDetect = autoDetect;
        window.resetToFull = resetToFull;
        window.redraw = redraw;
        window.processAndSave = processAndSave;
        window.shareOverlayImage = shareOverlayImage;
        window.closeOverlay = closeOverlay;
        window.toggleForceMode = toggleForceMode;
    </script>
</body>
