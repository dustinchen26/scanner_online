<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 掃描器 (by Dustin, chuhpsdustin@gmail.com)</title>
    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        html, body { height: 100%; overflow: hidden; }
        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #1e1e1e;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2d2d2d;
            flex-shrink: 0;
        }
        .logo { font-size: 1rem; font-weight: 700; color: #00d26a; display: flex; align-items: center; gap: 6px; }
        .status-badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 20px; background-color: #333; color: #aaa; }
        .status-badge.ready { background-color: #1b3bbb; color: #8bb2ff; }

        main {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0a0a0a;
            padding: 8px;
            min-height: 0;
            overflow: hidden;
        }
        #canvas-container {
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            border-radius: 6px;
            overflow: hidden;
            background: #181818;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            touch-action: none;
            cursor: crosshair;
        }
        .placeholder-text {
            position: absolute;
            color: #666;
            font-size: 1rem;
            text-align: center;
            pointer-events: none;
            padding: 0 16px;
        }

        footer {
            background-color: #1e1e1e;
            padding: 8px 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #2d2d2d;
            flex-shrink: 0;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .btn {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #3d3d3d;
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
        }
        .btn:active:not(:disabled) { transform: scale(0.96); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-primary {
            background-color: #107c41;
            border-color: #107c41;
            color: white;
            font-weight: 600;
        }
        .btn-primary:active:not(:disabled) { background-color: #0b5e31; }
        .checkbox-label, .select-label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.78rem;
            cursor: pointer;
            color: #ccc;
            white-space: nowrap;
        }
        .checkbox-label input[type="checkbox"] {
            width: 14px;
            height: 14px;
            accent-color: #00d26a;
            cursor: pointer;
        }
        .custom-select {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #3d3d3d;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.78rem;
            outline: none;
            cursor: pointer;
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border-left-color: #00d26a;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #output-canvas { display: none; }

        @media (max-width: 480px) {
            header { padding: 6px 10px; }
            .logo { font-size: 0.85rem; }
            .btn { font-size: 0.7rem; padding: 4px 8px; }
            .checkbox-label, .select-label { font-size: 0.7rem; }
            .custom-select { font-size: 0.7rem; padding: 3px 6px; }
            footer { padding: 6px 8px; gap: 4px; }
        }
        @media (min-width: 769px) {
            .btn { padding: 8px 18px; font-size: 0.95rem; }
            .checkbox-label, .select-label { font-size: 0.9rem; }
            .custom-select { font-size: 0.9rem; padding: 6px 12px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">📷 AI 掃描器 (by Dustin, chuhpsdustin@gmail.com)</div>
        <div id="status-badge" class="status-badge">載入中...</div>
    </header>

    <main>
        <div id="canvas-container">
            <canvas id="main-canvas"></canvas>
            <div id="placeholder" class="placeholder-text">點下方「📂 開啟照片」</div>
        </div>
    </main>

    <footer>
        <div class="control-group">
            <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="handleFileSelect(event)">
            <button class="btn" onclick="document.getElementById('file-input').click()">📂 開啟</button>
            <button class="btn" id="btn-auto" onclick="autoDetect()" disabled>🔍 自動</button>
            <button class="btn" id="btn-reset" onclick="resetToFull()" disabled>🔄 全畫面</button>
        </div>

        <div class="control-group">
            <label class="checkbox-label">
                <input type="checkbox" id="filter-check" onchange="redraw()"> 優化
            </label>
            <label class="select-label">
                <select id="export-format" class="custom-select">
                    <option value="png">PNG</option>
                    <option value="jpg_max">JPG 100%</option>
                    <option value="jpg_standard">JPG 92%</option>
                </select>
            </label>
            <button class="btn btn-primary" id="btn-save" onclick="processAndSave()" disabled>✅ 儲存</button>
        </div>
    </footer>

    <canvas id="output-canvas"></canvas>

    <script>
        // ============================================================
        //  核心變數與初始化
        // ============================================================
        let cvReady = false;
        let origImage = null;
        let imgMat = null;
        let displayWidth = 0;
        let displayHeight = 0;
        let scaleRatio = 1.0;
        let points = [];
        let selectedIdx = -1;
        let isDragging = false;

        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');
        const placeholder = document.getElementById('placeholder');
        const statusBadge = document.getElementById('status-badge');

        function onOpenCvReady() {
            cv.onRuntimeInitialized = () => {
                cvReady = true;
                statusBadge.textContent = "系統就緒";
                statusBadge.classList.add("ready");
            };
        }

        // ---- 檔案載入 ----
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    origImage = img;
                    let tempCanvas = document.createElement('canvas');
                    tempCanvas.width = img.width;
                    tempCanvas.height = img.height;
                    let tempCtx = tempCanvas.getContext('2d');
                    tempCtx.drawImage(img, 0, 0);
                    if (imgMat) imgMat.delete();
                    if (cvReady) {
                        imgMat = cv.imread(tempCanvas);
                    }
                    fitCanvasToWindow();
                    placeholder.style.display = 'none';
                    document.getElementById('btn-auto').disabled = false;
                    document.getElementById('btn-reset').disabled = false;
                    document.getElementById('btn-save').disabled = false;

                    // ★ 先強制設定為全畫面，確保點清楚可見
                    resetToFull();
                    // 再嘗試自動偵測（若成功則覆蓋，失敗則保留全畫面）
                    autoDetect();
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ---- 圖片自動放大填滿容器 ----
        function fitCanvasToWindow() {
            if (!origImage) return;
            const container = document.getElementById('canvas-container');
            const maxW = container.clientWidth - 4;
            const maxH = container.clientHeight - 4;
            if (maxW < 10 || maxH < 10) return;

            let w = origImage.width, h = origImage.height;
            const scale = Math.min(maxW / w, maxH / h);
            displayWidth = Math.round(w * scale);
            displayHeight = Math.round(h * scale);
            canvas.width = displayWidth;
            canvas.height = displayHeight;
            scaleRatio = origImage.width / displayWidth;

            // 若已經有四個點，按比例調整位置，避免跑出邊界
            if (points.length === 4) {
                // 計算舊尺寸（若無則用當前顯示尺寸）
                const oldW = canvas.width || displayWidth;
                const oldH = canvas.height || displayHeight;
                if (oldW > 0 && oldH > 0) {
                    const sx = displayWidth / oldW;
                    const sy = displayHeight / oldH;
                    points = points.map(p => ({
                        x: Math.min(displayWidth - 2, Math.max(2, p.x * sx)),
                        y: Math.min(displayHeight - 2, Math.max(2, p.y * sy))
                    }));
                } else {
                    // 若無舊尺寸，直接重置為全畫面
                    resetToFull();
                }
            }
            redraw();
        }

        window.addEventListener('resize', () => {
            if (origImage) fitCanvasToWindow();
        });

        // ============================================================
        //  拖曳控制 (穩定版，阻止滾動)
        // ============================================================
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function handleStart(e) {
            if (!points.length) return;
            e.preventDefault();
            const pos = getCanvasCoords(e);
            const threshold = 30;
            for (let i = 0; i < points.length; i++) {
                const dx = pos.x - points[i].x;
                const dy = pos.y - points[i].y;
                if (dx*dx + dy*dy < threshold*threshold) {
                    selectedIdx = i;
                    isDragging = true;
                    break;
                }
            }
        }

        function handleMove(e) {
            if (!isDragging || selectedIdx < 0) return;
            e.preventDefault();
            const pos = getCanvasCoords(e);
            const x = Math.max(2, Math.min(displayWidth-2, pos.x));
            const y = Math.max(2, Math.min(displayHeight-2, pos.y));
            points[selectedIdx] = { x, y };
            redraw();
        }

        function handleEnd(e) {
            if (isDragging) {
                isDragging = false;
                selectedIdx = -1;
            }
        }

        canvas.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', (e) => { if (isDragging) handleMove(e); });
        window.addEventListener('mouseup', handleEnd);

        canvas.addEventListener('touchstart', handleStart, { passive: false });
        window.addEventListener('touchmove', (e) => { if (isDragging) handleMove(e); }, { passive: false });
        window.addEventListener('touchend', handleEnd);

        // ---- 排序點 (確保順序正確) ----
        function sortPoints(pts) {
            let sums = pts.map(p => p.x + p.y);
            let diffs = pts.map(p => p.y - p.x);
            let topLeft = pts[sums.indexOf(Math.min(...sums))];
            let bottomRight = pts[sums.indexOf(Math.max(...sums))];
            let topRight = pts[diffs.indexOf(Math.min(...diffs))];
            let bottomLeft = pts[diffs.indexOf(Math.max(...diffs))];
            return [topLeft, topRight, bottomRight, bottomLeft];
        }

        // ============================================================
        //  ★★★ 強化自動偵測 (Otsu + 面積過濾) ★★★
        // ============================================================
        function autoDetect() {
            if (!cvReady || !imgMat) { resetToFull(); return; }
            try {
                let gray = new cv.Mat();
                cv.cvtColor(imgMat, gray, cv.COLOR_RGBA2GRAY);

                let blurred = new cv.Mat();
                cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);

                let thresh = new cv.Mat();
                cv.threshold(blurred, thresh, 0, 255, cv.THRESH_BINARY + cv.THRESH_OTSU);

                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(thresh, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let totalArea = imgMat.rows * imgMat.cols;
                let maxArea = 0;
                let bestApprox = null;

                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    let area = cv.contourArea(cnt);
                    if (area < totalArea * 0.01 || area > totalArea * 0.95) {
                        cnt.delete();
                        continue;
                    }
                    let peri = cv.arcLength(cnt, true);
                    let approx = new cv.Mat();
                    cv.approxPolyDP(cnt, approx, 0.02 * peri, true);
                    if (approx.rows === 4 && area > maxArea) {
                        maxArea = area;
                        if (bestApprox) bestApprox.delete();
                        bestApprox = approx;
                    } else {
                        approx.delete();
                    }
                    cnt.delete();
                }

                if (bestApprox && maxArea > totalArea * 0.05) { // 至少佔畫面5%才視為有效
                    let detected = [];
                    for (let i = 0; i < 4; i++) {
                        detected.push({
                            x: bestApprox.data32S[i*2] / scaleRatio,
                            y: bestApprox.data32S[i*2+1] / scaleRatio
                        });
                    }
                    points = sortPoints(detected);
                    bestApprox.delete();
                } else {
                    // 若偵測不到或面積太小，保持全畫面
                    if (bestApprox) bestApprox.delete();
                    resetToFull();
                }

                gray.delete(); blurred.delete(); thresh.delete();
                contours.delete(); hierarchy.delete();

            } catch(err) {
                console.warn("Auto detect error, keeping full view", err);
                resetToFull();
            }
            redraw();
        }

        function resetToFull() {
            const margin = 20;
            if (displayWidth < 40 || displayHeight < 40) {
                // 若畫面太小，設為0邊距
                points = [
                    { x: 0, y: 0 },
                    { x: displayWidth || 100, y: 0 },
                    { x: displayWidth || 100, y: displayHeight || 100 },
                    { x: 0, y: displayHeight || 100 }
                ];
            } else {
                points = [
                    { x: margin, y: margin },
                    { x: displayWidth - margin, y: margin },
                    { x: displayWidth - margin, y: displayHeight - margin },
                    { x: margin, y: displayHeight - margin }
                ];
            }
            redraw();
        }

        function redraw() {
            if (!origImage) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(origImage, 0, 0, displayWidth, displayHeight);
            if (points.length === 4) {
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                ctx.lineTo(points[1].x, points[1].y);
                ctx.lineTo(points[2].x, points[2].y);
                ctx.lineTo(points[3].x, points[3].y);
                ctx.closePath();
                ctx.fillStyle = 'rgba(0, 255, 100, 0.2)';
                ctx.fill();
                ctx.strokeStyle = '#00ff66';
                ctx.lineWidth = 2;
                ctx.stroke();

                points.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 10, 0, 2*Math.PI);
                    ctx.fillStyle = '#0078d4';
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                });
            }
        }

        // ---- 彩色濾鏡 ----
        function applyColorPerfectFilter(srcMat) {
            let rgbMat = new cv.Mat();
            cv.cvtColor(srcMat, rgbMat, cv.COLOR_RGBA2RGB);
            let smooth = new cv.Mat();
            cv.bilateralFilter(rgbMat, smooth, 9, 75, 75);
            let hsv = new cv.Mat();
            cv.cvtColor(smooth, hsv, cv.COLOR_RGB2HSV);
            let channels = new cv.MatVector();
            cv.split(hsv, channels);
            let s = channels.get(1);
            let v = channels.get(2);
            s.convertTo(s, -1, 1.25, 0);
            v.convertTo(v, -1, 1.1, 0);
            cv.merge(channels, hsv);
            let enhanced = new cv.Mat();
            cv.cvtColor(hsv, enhanced, cv.COLOR_HSV2RGB);
            let finalResult = new cv.Mat();
            enhanced.convertTo(finalResult, -1, 1.1, -10);
            rgbMat.delete(); smooth.delete(); hsv.delete();
            channels.delete(); s.delete(); v.delete(); enhanced.delete();
            return finalResult;
        }

        // ---- 判斷行動裝置 ----
        function isMobileDevice() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            if (/iPhone|iPad|iPod|Android|BlackBerry|Windows Phone|Opera Mini|IEMobile/i.test(ua)) return true;
            if (window.innerWidth < 768 && ('ontouchstart' in window || navigator.maxTouchPoints > 0)) return true;
            return false;
        }

        // ============================================================
        //  ★★★ 儲存邏輯 (強制排序，避免翻轉) ★★★
        // ============================================================
        function processAndSave() {
            if (!origImage || points.length !== 4) return;
            const saveBtn = document.getElementById('btn-save');
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<span class="spinner"></span> 處理中...';

            setTimeout(() => {
                try {
                    const sortedPts = sortPoints(points);
                    const origPts = sortedPts.map(p => ({
                        x: p.x * scaleRatio,
                        y: p.y * scaleRatio
                    }));

                    let w1 = Math.hypot(origPts[1].x - origPts[0].x, origPts[1].y - origPts[0].y);
                    let w2 = Math.hypot(origPts[2].x - origPts[3].x, origPts[2].y - origPts[3].y);
                    let maxW = Math.max(Math.round(w1), Math.round(w2));
                    let h1 = Math.hypot(origPts[1].x - origPts[2].x, origPts[1].y - origPts[2].y);
                    let h2 = Math.hypot(origPts[0].x - origPts[3].x, origPts[0].y - origPts[3].y);
                    let maxH = Math.max(Math.round(h1), Math.round(h2));

                    let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                        origPts[0].x, origPts[0].y,
                        origPts[1].x, origPts[1].y,
                        origPts[2].x, origPts[2].y,
                        origPts[3].x, origPts[3].y
                    ]);
                    let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                        0, 0,
                        maxW - 1, 0,
                        maxW - 1, maxH - 1,
                        0, maxH - 1
                    ]);
                    let M = cv.getPerspectiveTransform(srcTri, dstTri);
                    let warped = new cv.Mat();
                    let dsize = new cv.Size(maxW, maxH);
                    cv.warpPerspective(imgMat, warped, M, dsize, cv.INTER_LANCZOS4, cv.BORDER_CONSTANT, new cv.Scalar());

                    const applyFilter = document.getElementById('filter-check').checked;
                    let finalMat = warped;
                    if (applyFilter) {
                        finalMat = applyColorPerfectFilter(warped);
                        warped.delete();
                    }

                    const outCanvas = document.getElementById('output-canvas');
                    outCanvas.width = maxW;
                    outCanvas.height = maxH;
                    cv.imshow(outCanvas, finalMat);

                    srcTri.delete(); dstTri.delete(); M.delete(); finalMat.delete();

                    const formatChoice = document.getElementById('export-format').value;
                    let mimeType, fileName, quality;
                    if (formatChoice === 'png') {
                        mimeType = 'image/png';
                        fileName = 'scanner_output.png';
                        quality = undefined;
                    } else if (formatChoice === 'jpg_max') {
                        mimeType = 'image/jpeg';
                        fileName = 'scanner_output.jpg';
                        quality = 1.0;
                    } else {
                        mimeType = 'image/jpeg';
                        fileName = 'scanner_output.jpg';
                        quality = 0.92;
                    }

                    outCanvas.toBlob(function(blob) {
                        if (!blob) { alert('產生圖片失敗'); saveBtn.disabled = false; saveBtn.innerHTML = '✅ 儲存'; return; }

                        const mobile = isMobileDevice();
                        if (mobile && navigator.share && navigator.canShare) {
                            const file = new File([blob], fileName, { type: mimeType });
                            const shareData = { files: [file], title: '掃描結果' };
                            if (navigator.canShare(shareData)) {
                                navigator.share(shareData)
                                    .catch(err => { if (err.name !== 'AbortError') fallbackDownload(blob, fileName); })
                                    .finally(() => { saveBtn.disabled = false; saveBtn.innerHTML = '✅ 儲存'; });
                                return;
                            }
                        }
                        fallbackDownload(blob, fileName);
                        saveBtn.disabled = false;
                        saveBtn.innerHTML = '✅ 儲存';
                    }, mimeType, quality);

                } catch(e) {
                    alert('處理失敗，請再試');
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = '✅ 儲存';
                }
            }, 50);
        }

        function fallbackDownload(blob, fileName) {
            const link = document.createElement('a');
            link.download = fileName;
            link.href = URL.createObjectURL(blob);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(link.href), 5000);
        }

        // 初始化 (無圖片時顯示提示)
        resetToFull();
    </script>
</body>
</html>
